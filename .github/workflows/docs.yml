name: Deploy Landing Page + Knowledge Base to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 把仓库根目录的知识库源文件组装进 docs/kb/，让 docs/ 成为自包含的静态站
      # - 根目录 _sidebar.md / home.md 为唯一数据源（由 tools/gen_sidebar.py 生成）
      # - data/knowledge_base/*.md 为词条正文
      # 组装逻辑与本地预览共用同一脚本，避免两处分叉
      - name: Assemble knowledge base into docs/kb
        run: |
          set -e
          python tools/build_site.py
          echo "---- assembled docs/kb ----"
          find docs/kb -type f | wc -l
          echo "kb entries: $(find docs/kb/data/knowledge_base -name '*.md' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
